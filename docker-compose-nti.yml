# version: '3.8'

volumes:
  postgres_data:
  projectmanagement-attachments:
  seq-data:
  redis_data:
  # minio_data: # เพิ่ม volume สำหรับ MinIO data
  # minio_config: # เพิ่ม volume สำหรับ MinIO config
  postgres_backup_data: # Volume for storing Postgres backups

services:
  projectmanagement-application-core:
    hostname: projectmanagement-application-core
    image: projectmanagement-application-core
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TZ=Asia/Bangkok
      - DefaultConnection=Host=postgres;Database=PM-db;Username=admin;Password=P@ssw0rd;
      - HangfireConnection=Host=postgres;Database=PM-db;Username=admin;Password=P@ssw0rd;
      - SeqServerUrl=http://seq:80
      - Authority=https://ntiportal.nti.co.th/
      - RedisConfiguration=redis:6379
      - FreeUriTimeStamp=http://timestamp.digicert.com
      - UriTimeStamp=http://timestamp.digicert.com
      - TSAProviderAuthenType=UserPasswordAuthen
      - UsernameTimeStamp=-
      - PasswordTimeStamp=-
      - MinIOUrlExternal=192.168.98.142:9000
      - MinIOUrlInternal=192.168.98.142:9000
      - MinIOAccessKey=im8OFJnjH61sk6k2qNdw
      - MinIOSecretKey=U3BDpc3Rw4cJL0OS493gpn2Fwzl8TffROTYOUnmz
    ports:
      - "8800:8080"
    volumes:
      - projectmanagement-attachments:/projectmanagement-attachments
    depends_on:
      - postgres

  projectmanagement-client-app:
    hostname: projectmanagement-client-app
    image: projectmanagement-client-app
    build:
      context: .
      dockerfile: ./src/client_web/docker/Dockerfile
      args:
        - VITE_API_BACKEND_URL=crm.nti.co.th
    ports:
      - 8098:8888


  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "seqP@ssw0rd"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  postgres:
    image: postgres:17.2
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: P@ssw0rd
      POSTGRES_DB: PM-db
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    hostname: nginx
    restart: always
    ports:
      - 80:80
      - 443:443
    build:
      context: .
      dockerfile: ./nginx/docker/dockerfile
    volumes:
       - ./nginx/nti/nginx.conf:/etc/nginx/nginx.conf
       - ./nginx/ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem
       - ./nginx/ssl/private.key:/etc/nginx/ssl/private.key

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    # command: ["redis-server", "--requirepass", "P@ssw0rd"]
    volumes:
      - redis_data:/data

  # Postgres backup service using prodrigestivill/postgres-backup-local
  # This service backs up the 'postgres' database daily to the 'postgres_backup_data' volume.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:latest
    restart: always
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=PM-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=P@ssw0rd
      - SCHEDULE=@daily # Backup runs daily; adjust as needed
      - BACKUP_DIR=/backups
      # Optional: set POSTGRES_EXTRA_OPTS for custom pg_dump options
    volumes:
      - postgres_backup_data:/backups
    # Uncomment below to set timezone if needed
    # environment:
    #   - TZ=Asia/Bangkok
