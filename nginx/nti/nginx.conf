events {
	worker_connections 1024;
}

http {
	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;
	large_client_header_buffers 4 16k;
	client_max_body_size 100M;

	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

	access_log /var/log/nginx/access.log main;
	error_log /var/log/nginx/error.log;

	upstream backend {
        server projectmanagement-application-core:8080;
    }

	upstream frontend {
        server projectmanagement-client-app:8888;
	}
	# upstream minio_s3 {
    #     least_conn;
    #     server minio:9000;
    # }

    # upstream minio_console  {
    #     least_conn;
    #     server minio:9001;
    # }

	server {
        listen 80;
        server_name crm.nti.co.th;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name crm.nti.co.th;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        location / {
			proxy_pass http://frontend;
		}	

        location /api/ {
			proxy_pass http://backend;
			proxy_connect_timeout 60s;
            proxy_read_timeout 5400s;
            proxy_send_timeout 5400s;
     		proxy_set_header        Host $server_name;
     		proxy_set_header        X-Real-IP $remote_addr;
     		proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
     		proxy_set_header        X-Forwarded-Proto $scheme;
     		proxy_request_buffering off;
     		proxy_buffering off;
     		proxy_redirect off;
        }

        location /seq/ {
			rewrite ^/seq/(.*) /$1 break;  # Rewrite the URL to remove /seq
            proxy_pass http://seq;  # Forward requests to the Seq container
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

		location /hangfire {
            proxy_pass http://backend;  # Forward requests to the Seq container
			proxy_pass_header Set-Cookie;
        	proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
    		proxy_set_header Cookie $http_cookie;
			proxy_set_header Set-Cookie $upstream_http_set_cookie;
			proxy_cookie_path / "/; SameSite=None";
        }
    }
}
